
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HAMAD MUSIC</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background: #08060e;
  color: white;
  font-family: Arial, sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
}

.container {
  max-width: 500px;
  margin: auto;
  padding: 22px 18px;
  text-align: center;
}

.logo {
  color: #c56aff;
  font-size: 27px;
  font-weight: 900;
  letter-spacing: 3px;
  margin-top: 20px;
  text-shadow: 0 0 20px #a000ff;
}

.headphones {
  font-size: 100px;
  margin: 35px 0 15px;
  filter: drop-shadow(0 0 20px #a000ff);
}

h1 {
  font-size: 35px;
  background: linear-gradient(90deg,#fff,#bd65ff,#fff);
  background-clip: text;
  -webkit-background-clip: text;
  color: transparent;
  font-weight: 900;
}

.line {
  width: 75%;
  height: 2px;
  margin: 22px auto;
  background: linear-gradient(90deg,transparent,#b34aff,transparent);
}

.dedication {
  margin-top: 25px;
  color: #e4c3ff;
  font-size: 21px;
}

.name {
  color: #ffd58b;
  font-size: 27px;
  font-weight: bold;
  margin: 15px 0;
  text-shadow: 0 0 15px #9e50ff;
  direction: ltr;
}

.designer {
  color: #ddd;
  font-size: 16px;
  margin: 22px 0 35px;
}

.library {
  border: 1px solid #a33aff;
  border-radius: 22px;
  padding: 20px;
  background: linear-gradient(145deg,#21102f,#100b19);
  box-shadow: 0 0 25px #8b19c944;
}

.library h2 {
  font-size: 23px;
  margin-bottom: 8px;
}

.library p {
  color: #c69be7;
  font-size: 14px;
  margin-bottom: 18px;
}

.add-btn {
  display: block;
  padding: 17px;
  border-radius: 15px;
  background: linear-gradient(90deg,#8b20e9,#c34aff);
  color: white;
  font-weight: bold;
  font-size: 17px;
  cursor: pointer;
}

input[type=file] {
  display: none;
}

#songList {
  margin-top: 20px;
  text-align: right;
}

.song {
  padding: 14px;
  background: #21182c;
  border: 1px solid #49305e;
  border-radius: 12px;
  margin-top: 9px;
  cursor: pointer;
  overflow-wrap: anywhere;
}

.song.active {
  border-color: #d16aff;
  background: #39204d;
}

.player {
  margin-top: 25px;
  padding: 20px;
  border-radius: 20px;
  background: #17101f;
  border: 1px solid #39204d;
}

#currentSong {
  color: #dcaaff;
  margin-bottom: 15px;
  overflow-wrap: anywhere;
}

audio {
  width: 100%;
  height: 45px;
  accent-color: #b34aff;
}

.footer {
  color: #777;
  margin-top: 30px;
  font-size: 12px;
}
</style>
</head>

<body>

<div class="container">

  <div class="logo">♫ HAMAD MUSIC</div>

  <div class="headphones">🎧</div>

  <h1>HAMAD MUSIC</h1>

  <div class="line"></div>

  <div class="dedication">♡ إهداء إلى ♡</div>

  <div class="name">Mona Badr El-Din</div>

  <div class="designer">تصميم حمد عبدالله</div>

  <div class="library">
    <h2>🎵 مكتبة الأغاني</h2>
    <p>أضف أغانيك المفضلة من هاتفك</p>

    <label for="files" class="add-btn">
      📁 اختر الأغاني من الهاتف
    </label>

    <input id="files" type="file"
    accept="audio/*" multiple>

    <div id="songList"></div>
  </div>

  <div class="player">
    <div id="currentSong">اختر أغنية لتشغيلها</div>
    <audio id="audio" controls></audio>
  </div>

  <div class="footer">
    HAMAD MUSIC © 2026
    <br><br>
    Designed by Hamad Abdullah
  </div>

</div>

<script>
const files = document.getElementById("files");
const audio = document.getElementById("audio");
const songList = document.getElementById("songList");
const currentSong = document.getElementById("currentSong");

let songs = [];
let currentIndex = -1;

files.addEventListener("change", function() {
  const selected = Array.from(files.files);

  selected.forEach(file => {
    if (!songs.some(song => song.file.name === file.name &&
        song.file.size === file.size)) {
      songs.push({
        file: file,
        url: URL.createObjectURL(file)
      });
    }
  });

  showSongs();

  if (currentIndex === -1 && songs.length > 0) {
    playSong(0);
  }
});

function showSongs() {
  songList.innerHTML = "";

  songs.forEach((song, index) => {
    const item = document.createElement("div");
    item.className = "song" +
      (index === currentIndex ? " active" : "");

    item.textContent = "♫ " + song.file.name;

    item.onclick = () => playSong(index);

    songList.appendChild(item);
  });
}

function playSong(index) {
  if (!songs[index]) return;

  currentIndex = index;
  audio.src = songs[index].url;
  currentSong.textContent = songs[index].file.name;

  audio.play();
  showSongs();
}

audio.addEventListener("ended", function() {
  if (currentIndex < songs.length - 1) {
    playSong(currentIndex + 1);
  }
});
</script>

</body>
</html>
